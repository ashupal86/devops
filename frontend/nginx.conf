server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    # ---------------------------------------------------------
    # API requests
    #
    # FastAPI serves every route under /api, so the path is
    # forwarded unchanged (no trailing slash on proxy_pass):
    #
    # /api/profiles  ->  backend:8000/api/profiles
    # ---------------------------------------------------------

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------
    # React/Vite SPA routing
    # ---------------------------------------------------------

    # Kubernetes liveness/readiness probe for this pod.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
