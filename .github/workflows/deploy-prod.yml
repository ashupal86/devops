name: Deploy Production

on:
  push:
    branches:
      - main

# -------------------------------------------------------------
# Required for GitHub OIDC -> AWS IAM
# -------------------------------------------------------------
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

  EKS_CLUSTER_NAME: social-links-prod

  BACKEND_ECR_REPOSITORY: social-links-prod/backend
  FRONTEND_ECR_REPOSITORY: social-links-prod/frontend

  K8S_NAMESPACE: social-links

jobs:

  # ===========================================================
  # 1. RUN TESTS
  # ===========================================================

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Backend
      # -------------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: latest

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

      # -------------------------------------------------------
      # Frontend
      # -------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # ===========================================================
  # 2. BUILD AND PUSH DOCKER IMAGES
  # ===========================================================

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    needs:
      - test

    outputs:
      ecr_registry: ${{ steps.ecr-login.outputs.registry }}

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # AWS OIDC LOGIN
      #
      # No AWS access key or secret is stored in GitHub.
      # GitHub gets a temporary AWS credential through OIDC.
      # -------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------------
      # Login to ECR
      # -------------------------------------------------------

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------------------------------------
      # Save ECR registry
      # -------------------------------------------------------

      - name: Set ECR registry
        run: |
          echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Create immutable image tag.
      #
      # Git SHA is better than "latest" because every deployment
      # can be traced to an exact Git commit.
      # -------------------------------------------------------

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Build backend image
      # -------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}" \
            ./backend

      # -------------------------------------------------------
      # Push backend image
      # -------------------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            "${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}"

      # -------------------------------------------------------
      # Build frontend image
      # -------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}" \
            ./frontend

      # -------------------------------------------------------
      # Push frontend image
      # -------------------------------------------------------

      - name: Push frontend image
        run: |
          docker push \
            "${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}"


  # ===========================================================
  # 3. DEPLOY TO EKS
  # ===========================================================

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      # -------------------------------------------------------
      # Checkout repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # AWS OIDC LOGIN
      # -------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------------
      # Install kubectl
      # -------------------------------------------------------

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # -------------------------------------------------------
      # Configure kubeconfig
      # -------------------------------------------------------

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      # -------------------------------------------------------
      # Verify cluster connectivity
      # -------------------------------------------------------

      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # -------------------------------------------------------
      # Deploy application
      # -------------------------------------------------------

      - name: Deploy Kubernetes manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
          # The namespace and DB secret come from Terraform.
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr_registry }}
        run: |
          sed \
            -e "s|BACKEND_IMAGE_PLACEHOLDER|${ECR_REGISTRY}/${BACKEND_ECR_REPOSITORY}:${IMAGE_TAG}|g" \
            -e "s|FRONTEND_IMAGE_PLACEHOLDER|${ECR_REGISTRY}/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}|g" \
            k8s/production.yaml \
            | kubectl apply -f -

      # -------------------------------------------------------
      # Wait for backend rollout
      # -------------------------------------------------------

      - name: Wait for backend rollout
        run: |
          kubectl rollout status \
            deployment/backend \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

      # -------------------------------------------------------
      # Wait for frontend rollout
      # -------------------------------------------------------

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status \
            deployment/frontend \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

      # -------------------------------------------------------
      # Show deployment
      # -------------------------------------------------------

      - name: Show deployment
        run: |
          kubectl get pods -n "${K8S_NAMESPACE}"
          kubectl get svc -n "${K8S_NAMESPACE}"
