[project]
name = "social-links-api"
version = "0.1.0"
description = "Backend for social-links: shareable digital profiles"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
