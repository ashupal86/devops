# ============================================================
# ALEMBIC CONFIGURATION
# ============================================================

[alembic]

# Location of Alembic migration files.
script_location = %(here)s/alembic

# Do NOT put DATABASE_URL here.
#
# Production credentials must never be committed to Git.
#
# alembic/env.py loads DATABASE_URL from the environment.
sqlalchemy.url =


# ============================================================
# LOGGING
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =


[logger_alembic]
level = INFO
handlers =


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
