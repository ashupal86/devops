# =============================================================
# PRODUCTION MANIFESTS
# =============================================================
#
# The namespace and the backend-database secret (DATABASE_URL
# pointing at RDS) are created by Terraform in
# infra/terraform/app_bootstrap.tf. Apply Terraform first.
#
# BACKEND_IMAGE_PLACEHOLDER / FRONTEND_IMAGE_PLACEHOLDER are
# replaced with ECR image URIs at deploy time.
# =============================================================

# =============================================================
# BACKEND DEPLOYMENT
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: social-links

spec:
  # Two pods (one per node/AZ) at rest. The HPA below adds more
  # under load and scales back to two when it drops.
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      # Spread replicas across the two nodes (and AZs) once the
      # HPA scales past one pod.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend

      containers:
        - name: backend

          image: BACKEND_IMAGE_PLACEHOLDER

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          # ---------------------------------------------------
          # DATABASE_URL -> Amazon RDS (Terraform-managed secret)
          # ---------------------------------------------------

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-database
                  key: DATABASE_URL

            # Browsers reach the API through nginx on the same
            # origin, so no cross-origin callers are allowed.
            - name: CORS_ORIGINS
              value: ""

            # 8 pods x (5 + 3) = 64 connections, plus one short-lived
            # readiness-probe connection per pod (72), under the
            # ~80 max_connections of a db.t4g.micro.
            - name: DB_POOL_SIZE
              value: "5"

            - name: DB_MAX_OVERFLOW
              value: "3"

          # ---------------------------------------------------
          # Resources
          #
          # The HPA target is a percentage of the request, so the
          # request must be close to real per-pod usage. With a
          # 100m request and a 500m limit the pods were throttled
          # at 480m while the HPA read that as 480%.
          #
          # One uvicorn process can use about one core (GIL), so
          # the limit is 1000m. Scale-out comes from more pods.
          # ---------------------------------------------------

          resources:
            requests:
              cpu: "250m"
              memory: "160Mi"

            limits:
              cpu: "1000m"
              memory: "320Mi"

          # ---------------------------------------------------
          # Health checks
          #
          # Readiness checks RDS, so a pod only receives traffic
          # once it can reach the database.
          #
          # The default 1 s timeout failed under load: pods were
          # pulled from the Service (502s) and restarted by the
          # liveness probe, which cascaded onto the other pods.
          # Liveness now tolerates about a minute of slowness.
          # ---------------------------------------------------

          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

      # Let in-flight requests finish when the HPA or Cluster
      # Autoscaler removes a pod.
      terminationGracePeriodSeconds: 30

---
# =============================================================
# BACKEND POD DISRUPTION BUDGET
# =============================================================
#
# When the Cluster Autoscaler drains an underused node it evicts
# pods one at a time and never below this, so scale-down cannot
# take the backend fully offline.
# =============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: social-links

spec:
  minAvailable: 1

  selector:
    matchLabels:
      app: backend

---
# =============================================================
# BACKEND SERVICE
# =============================================================

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: social-links

spec:
  # Backend does NOT need a public AWS Load Balancer.
  #
  # Nginx/frontend will reach:
  #
  # http://backend:8000
  #
  type: ClusterIP

  selector:
    app: backend

  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP

---
# =============================================================
# FRONTEND DEPLOYMENT
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: social-links

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      # Prefer the node that is not running the backend, so the
      # two nodes start with one application pod each.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend

      containers:
        - name: frontend

          image: FRONTEND_IMAGE_PLACEHOLDER

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "200m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80

            initialDelaySeconds: 2
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 20

---
# =============================================================
# FRONTEND SERVICE
# =============================================================
#
# The AWS Load Balancer Controller turns this into an
# internet-facing Network Load Balancer that sends traffic
# straight to the pod IPs.
# =============================================================

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: social-links

  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /healthz
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP

spec:
  type: LoadBalancer

  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
# =============================================================
# HORIZONTAL POD AUTOSCALERS
# =============================================================
#
# Pods scale on CPU (metrics-server is installed by Terraform).
#
# Scale-up is fast (double, or +4 pods, every 15 s). Scale-down
# waits for 3 minutes of low CPU, then removes at most half the
# pods per minute, back to minReplicas.
#
# Pods that do not fit on the current nodes stay Pending; the
# Cluster Autoscaler (infra/terraform/cluster_autoscaler.tf)
# adds a node for them and removes nodes that sit underused.
# =============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: social-links

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend

  minReplicas: 2

  maxReplicas: 8

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization

          averageUtilization: 70

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0

      selectPolicy: Max

      policies:
        - type: Percent
          value: 100
          periodSeconds: 15

        - type: Pods
          value: 4
          periodSeconds: 15

    scaleDown:
      stabilizationWindowSeconds: 180

      selectPolicy: Min

      policies:
        - type: Percent
          value: 50
          periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: social-links

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend

  minReplicas: 1

  maxReplicas: 2

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization

          averageUtilization: 70

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 180
